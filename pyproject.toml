[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "runscroll"
version = "0.1.0"
description = "Single-file scrollable HTML report for one-shot batch jobs (ETL, ML training, migrations, crawlers). Streaming append-write. No server. No infra."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Hyunwoo Seo", email = "shw4008@gmail.com" }]
keywords = [
    # what it produces
    "html-report",
    "single-file",
    "self-contained",
    "scrollable",
    "standalone",
    # when it's used
    "post-mortem",
    "batch",
    "one-shot",
    "pipeline-report",
    "audit",
    "run-summary",
    "snapshot",
    "diagnostic",
    # domains
    "etl",
    "ml-training",
    "training-report",
    "data-migration",
    "data-quality",
    "crawler",
    # design properties
    "streaming-write",
    "no-server",
    "report",
    "html",
    "logging",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Documentation",
    "Topic :: Scientific/Engineering :: Visualization",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Topic :: Software Development :: Quality Assurance",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Typing :: Typed",
]
dependencies = []

[project.optional-dependencies]
# Adapter extras — each pulled in only when that adapter is used.
matplotlib = ["matplotlib>=3.5"]
plotly = ["plotly>=5.0"]
pandas = ["pandas>=1.3"]
pil = ["Pillow>=9.0"]
pygments = ["Pygments>=2.10"]

# Development extras — tests + memory measurement.
dev = [
    "pytest>=7.0",
    "psutil>=5.9",
]

[project.scripts]
runscroll = "runscroll.__main__:main"

[project.urls]
# These point at the GitHub repo where the package lives. Image refs in
# README.md resolve relative to "Repository" on the rendered PyPI page.
Homepage = "https://github.com/shw4008/runscroll"
Repository = "https://github.com/shw4008/runscroll"
Issues = "https://github.com/shw4008/runscroll/issues"
Changelog = "https://github.com/shw4008/runscroll/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/runscroll"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra -q"
